<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Activités guidées</title>
<link rel="stylesheet" href="prof.css">
<!-- Activités guidées (v65.5, novembre 2026) : la séance d'une activité guidée vue du téléphone du professeur —
     visas d'un geste (photos du poste, critères d'Évaluer), suivi par poste et par élève, réglages.
     Logique : seance.js ; accès, liste des élèves et chiffrement : socle.js. Le contenu de l'activité (étapes,
     schémas des visas) est lu dans son fichier chiffré (activites/) : rien de l'énoncé n'est en clair ici. -->
<style>
.file{display:flex;flex-direction:column;gap:10px}
.dem{display:flex;gap:10px;align-items:center;background:var(--carte);border:1px solid var(--bord);border-left:6px solid var(--orange);
  border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--txt);width:100%}
.dem .ph{display:flex;flex:none}
.dem .ph img{width:40px;height:50px;object-fit:cover;border-radius:7px;margin-right:-10px;border:2px solid var(--carte)}
.dem .tx{flex:1;min-width:0}
.dem b{display:block;font-size:15px}
.dem small{color:var(--gris);font-size:12.5px}
.dem .att{font-weight:700;color:var(--orange);font-size:13px;white-space:nowrap}
.dem.vieux{border-left-color:var(--rouge)}.dem.vieux .att{color:var(--rouge)}
.ref{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:4px;margin:8px 0}
.ref img{width:100%;height:auto;display:block}
.pts{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px}
.pt{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border-radius:9px;background:var(--doux);cursor:pointer}
.pt input{width:20px;height:20px;flex:none}
.mbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.mbs .tuile{width:96px;flex:none}
.mbs .tuile:not(.sel){opacity:.45}
.glisse{position:relative;height:58px;border-radius:29px;background:var(--vert);color:#fff;font-weight:700;margin:14px 0 10px;
  user-select:none;touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 14px 0 64px;text-align:center}
.glisse .poignee{position:absolute;left:4px;top:4px;width:50px;height:50px;border-radius:50%;background:#fff;color:var(--vert);
  display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 1px 4px #0004}
.glisse.fait{background:var(--n4)}
.pied-visa{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--carte);padding:6px 0 10px;margin:0 -2px;
  box-shadow:0 -8px 12px -8px #0003}
.pied-visa .glisse{margin:6px 0 4px}
.motifs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ind{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bord)}
.ind:last-child{border-bottom:0}
.ind .t{flex:1;min-width:0;font-size:14px}
.ind .t small{display:block;font-size:11.5px;color:var(--gris);margin-top:2px}
.tri{display:flex;gap:4px;flex:none}
.tri button{width:40px;height:38px;border-radius:9px;border:1px solid var(--bord);background:var(--carte);
  color:var(--gris);font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.tri button.on.a{background:var(--vert);border-color:var(--vert);color:#fff}
.tri button.on.p{background:var(--orange);border-color:var(--orange);color:#fff}
.tri button.on.n{background:var(--rouge);border-color:var(--rouge);color:#fff}
.poste{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:10px;margin-bottom:12px}
.poste h3{margin:0 0 8px;font-size:15px;color:var(--bleu);display:flex;gap:8px;align-items:baseline}
.poste h3 small{color:var(--gris);font-weight:500;font-size:12.5px}
.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.el{display:flex;gap:8px;align-items:center;background:var(--fond);border:1px solid var(--bord);border-radius:11px;padding:6px;cursor:pointer;font:inherit;color:var(--txt);text-align:left}
.el img{width:42px;height:53px;object-fit:cover;border-radius:7px;flex:none}
.el .i{min-width:0;flex:1}
.el b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el .e{font-size:12.5px}
.el .d{font-size:11.5px;color:var(--gris)}
.el.alerte{border-color:var(--rouge);box-shadow:inset 4px 0 0 var(--rouge)}
.el.visa{border-color:var(--orange);box-shadow:inset 4px 0 0 var(--orange)}
.el.fini{border-color:var(--vert);box-shadow:inset 4px 0 0 var(--vert)}
.el.loin{opacity:.6}
.fl{font-size:12px;margin-left:3px}
.barre-prog{height:5px;background:var(--doux);border-radius:3px;margin-top:3px;overflow:hidden}
.barre-prog i{display:block;height:100%;background:var(--vert)}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr img{width:170px;height:170px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--bord)}
.qr code{font-size:12.5px;word-break:break-all}
.code-sec{font:700 26px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--bleu)}
.lig{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--bord)}
.lig:last-child{border-bottom:0}
.lig .d{font-size:12.5px;color:var(--gris)}
.det-et{border-bottom:1px solid var(--bord);padding:8px 0}
.det-et .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.det-et .r{font-size:13px;color:var(--gris);margin-top:3px;white-space:pre-wrap}
.ok{color:var(--vert);font-weight:700}.ko{color:var(--rouge);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clic{cursor:pointer}
.reps{display:flex;flex-direction:column;gap:8px}
.rep{border:1px solid var(--bord);border-radius:10px;padding:8px 10px;font-size:14px;white-space:pre-wrap}
.rep b{display:block;font-size:12.5px;color:var(--gris)}
.badge-n{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
</style>
</head>
<body>
<header>
  <a class="retour" href="index.html">← Espace prof</a>
  <h1>Activités guidées</h1>
  <div class="barre">
    <select id="activite" aria-label="Activité"></select>
    <select id="classe" aria-label="Classe"></select>
    <span class="info synchro" id="sync"></span>
  </div>
</header>
<main>
  <section class="verrou" id="verrou" hidden></section>
  <div id="contenu" hidden>
    <section class="vue on" id="v-visas"></section>
    <section class="vue" id="v-suivi"></section>
    <section class="vue" id="v-etapes"></section>
    <section class="vue" id="v-reglages"></section>
  </div>
</main>
<nav class="bas" id="nav" hidden>
  <button type="button" data-v="visas" class="on">Visas<span id="nb-visas"></span></button>
  <button type="button" data-v="suivi">Suivi</button>
  <button type="button" data-v="etapes">Étapes</button>
  <button type="button" data-v="reglages">Réglages</button>
</nav>
<script src="../acces.js"></script>
<script src="../commun/cles.js?v=65"></script>
<script type="module">
import("./seance.js?v=655").catch(function (e) {
  console.error(e);
  document.querySelector("main").innerHTML = '<div class="panne"><b>Page indisponible</b><p>Le service de connexion '
    + '(Firebase, chargé depuis www.gstatic.com) ne répond pas : vérifier le réseau, puis recharger la page.</p></div>';
});
</script>
</body>
</html>
