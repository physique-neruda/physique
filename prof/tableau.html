<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tableau de bord</title>
<link rel="stylesheet" href="prof.css">
<!-- Tableau de bord (v65, novembre 2026) : l'activité des élèves sur le site, par classe et par élève — cartes,
     questionnaires, animations, corrigés débloqués et, quand le professeur les a activées après l'information des
     élèves, les mesures d'activité (temps de travail, animations ouvertes, réussite question par question).
     Tout est lu dans la base avec le compte professeur ; les noms viennent de la liste chiffrée (code enseignant).
     Rien n'est calculé ailleurs que sur cet appareil. Voir tableau.js. -->
<style>
.tdb{--s-1:#2a78d6;--s-2:#eb6834;--s-3:#1baf7a;--s-4:#eda100;--grille:#e7e9ee;--axe:#c7ccd4;--muet:#7b8591;
  --h0:#eef2f7;--h1:#cde2fb;--h2:#9ec5f4;--h3:#6da7ec;--h4:#3987e5;--h5:#256abf;--h6:#104281;--piste:#e3eefa}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .tdb{--s-1:#3987e5;--s-2:#d95926;--s-3:#199e70;--s-4:#c98500;
  --grille:#2c3138;--axe:#3a4048;--muet:#8d96a1;--h0:#262b31;--h1:#0d366b;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#b7d3f6;--piste:#1c2f47}}
:root[data-theme="dark"] .tdb{--s-1:#3987e5;--s-2:#d95926;--s-3:#199e70;--s-4:#c98500;
  --grille:#2c3138;--axe:#3a4048;--muet:#8d96a1;--h0:#262b31;--h1:#0d366b;--h2:#184f95;--h3:#256abf;--h4:#3987e5;--h5:#6da7ec;--h6:#b7d3f6;--piste:#1c2f47}
.filtres{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin:6px 0 12px}
.filtres label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.filtres select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--bord);background:var(--carte);color:var(--txt);min-height:42px;max-width:100%}
.seg2{display:flex;border:1px solid var(--bord);border-radius:10px;overflow:hidden;min-height:42px}
.seg2 button{font:inherit;font-size:14px;padding:8px 12px;border:0;background:var(--carte);color:var(--txt);cursor:pointer}
.seg2 button+button{border-left:1px solid var(--bord)}
.seg2 button.on{background:var(--bleu);color:#fff;font-weight:600}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;margin:12px 0;position:relative}
.carte h2{margin:0 0 2px}
.carte .sous{font-size:13px;color:var(--gris);margin:0 0 10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi>div{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:13px;color:var(--gris)}
.kpi .v{font-size:28px;font-weight:650;line-height:1.15;margin-top:2px}
.kpi .v small{font-size:15px;font-weight:500;color:var(--gris)}
.kpi .d{font-size:12px;color:var(--gris);margin-top:2px}
svg.graph{display:block;width:100%;height:auto;overflow:visible}
svg.graph text{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--muet);font-variant-numeric:tabular-nums}
svg.graph .grille{stroke:var(--grille);stroke-width:1}
svg.graph .axe{stroke:var(--axe);stroke-width:1}
svg.graph .zone{fill:transparent;cursor:default;outline:none}
svg.graph .bande{fill:transparent}
svg.graph .bande.on{fill:var(--doux)}
.legende{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--gris);margin:4px 0 6px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;width:12px;height:12px;border-radius:3px}
.bulle{position:absolute;z-index:3;pointer-events:none;background:var(--carte);border:1px solid var(--bord);border-radius:10px;
  box-shadow:0 6px 20px #0b1a2e26;padding:8px 10px;font-size:13px;min-width:140px;max-width:280px;display:none}
.bulle .t{font-size:12px;color:var(--gris);margin-bottom:4px}
.bulle .r{display:flex;align-items:center;gap:8px;line-height:1.5}
.bulle .r b{font-variant-numeric:tabular-nums}
.bulle .r .k{width:12px;height:3px;border-radius:2px;flex:none}
.bulle .r .n{color:var(--gris)}
details.vue-tableau{margin-top:8px;font-size:13px}
details.vue-tableau summary{cursor:pointer;color:var(--gris)}
details.vue-tableau table,table.liste{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.liste th,table.liste td,details.vue-tableau th,details.vue-tableau td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bord);vertical-align:top}
table.liste td:first-child{white-space:nowrap}
table.liste td.nb,details.vue-tableau td.nb{font-variant-numeric:tabular-nums;white-space:nowrap}
table.liste tr.clic{cursor:pointer}
table.liste tr.clic:hover td{background:var(--doux)}
table.liste a{color:var(--bleu);font-weight:600;text-decoration:none}
.defile{overflow-x:auto}
table.chaleur{border-collapse:separate;border-spacing:2px;font-size:12px;width:auto;min-width:0}
table.chaleur th{font-weight:600;color:var(--gris);padding:2px 4px;white-space:nowrap;border:0;text-transform:none;letter-spacing:0;font-size:12px}
table.chaleur th.nom{text-align:left;color:var(--txt);font-weight:400;font-size:13px;padding-right:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.chaleur td{width:34px;min-width:34px;height:24px;padding:0;border:0;border-radius:4px;background:var(--h0);outline:none}
table.chaleur td:hover,table.chaleur td:focus{box-shadow:0 0 0 2px var(--txt)}
.echelle{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gris);margin:8px 0 0;flex-wrap:wrap}
.echelle i{display:inline-block;width:22px;height:12px;border-radius:3px}
.barres .ligne-b{display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:4px 12px;align-items:center;margin:5px 0;font-size:13px}
.barres .piste{display:flex;align-items:center;gap:8px}
.barres .piste i{display:block;height:14px;border-radius:0 4px 4px 0;background:var(--s-1);min-width:2px}
.barres .piste span{font-variant-numeric:tabular-nums;color:var(--txt);white-space:nowrap}
.barres .piste span small{color:var(--gris)}
.q{border-bottom:1px solid var(--bord);padding:8px 0;font-size:14px}
.q:last-child{border-bottom:0}
.q .m{font-size:12px;color:var(--gris);margin-top:3px}
.q .compteur{display:block;height:6px;border-radius:3px;background:var(--piste);margin-top:6px;max-width:320px}
.q .compteur i{display:block;height:6px;border-radius:3px;background:var(--s-1)}
.bandeau-m{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;border:1px solid var(--bord);background:var(--carte)}
.bandeau-m.on{border-left:5px solid var(--vert)}
.bandeau-m.off{border-left:5px solid var(--gris)}
.bandeau-m .boutons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bandeau-m textarea{width:100%;min-height:220px;font:inherit;font-size:13px;padding:10px;border-radius:10px;border:1px solid var(--bord);background:var(--carte);color:var(--txt);margin-top:6px}
.vide2{color:var(--gris);font-size:14px;margin:6px 0}
.etiq{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--doux);color:var(--gris)}
@media print{header,.filtres,.bandeau-m,details.vue-tableau summary,.bulle{display:none!important}}
</style>
</head>
<body>
<header>
  <a class="retour" href="index.html">← Espace prof</a>
  <h1>Tableau de bord</h1>
  <div class="barre"><span class="info" id="etat">Chargement…</span></div>
</header>
<main class="tdb">
  <section class="verrou" id="verrou" hidden></section>
  <section id="outil" hidden>
    <div class="filtres">
      <label>Classe <select id="classe"></select></label>
      <label>Période <span class="seg2" id="periode">
        <button type="button" data-n="7">7 jours</button><button type="button" data-n="30">30 jours</button><button type="button" data-n="70">70 jours</button></span></label>
      <label>Élève <select id="eleve"></select></label>
      <label>&nbsp;<button class="mini" type="button" id="relire" style="min-height:42px">Relire la base</button></label>
    </div>
    <div id="mesures"></div>
    <div id="vue"></div>
    <p class="aide" id="pied"></p>
  </section>
</main>
<script src="../acces.js"></script>
<script src="../commun/cles.js?v=65"></script>
<script src="../entrainement/srs.js?v=65"></script>
<script src="../commun/donnees.js?v=64.2"></script>
<script type="module">
import("./tableau.js?v=65").catch(function (e) {
  console.error(e);
  document.getElementById("etat").textContent = "";
  document.querySelector("main").innerHTML = '<div class="panne"><b>Outil indisponible</b><p>Le service de connexion '
    + '(Firebase, chargé depuis www.gstatic.com) ne répond pas : vérifier le réseau, puis recharger la page.</p></div>';
});
</script>
</body>
</html>
