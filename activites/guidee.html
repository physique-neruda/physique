<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Activité guidée</title>
<link rel="stylesheet" href="../commun/theme.css?v=64">
<!-- Activité guidée (site v65.5, novembre 2026) : page en clair, sans contenu de cours. guidee.html?a=<filière>.<activité>
     ouvre le contenu chiffré activites/<filière>.<activité>.js.enc avec la clé de la filière (compte élève, ou accès de
     secours). Logique : guidee.js. -->
<style>
/* activité guidée — page élève (s'appuie sur commun/theme.css : papier, encre, signal) */
body.guidee{margin:0;background:var(--papier);color:var(--encre);font-family:var(--police);font-size:16px;line-height:1.45}
.g-tete{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--trait)}
.g-tete .retour{margin:0;flex:none}
.g-titre{flex:1;min-width:0}
.g-titre h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.g-titre p{margin:0;color:var(--ardoise);font-size:.82rem}
.g-qui{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--trait);background:var(--papier);color:var(--encre);
  border-radius:999px;padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;max-width:48vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-qui .pt{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none}
.g-qui.hors .pt{background:var(--orange)}
.g-app{max-width:760px;margin:0 auto;padding:12px 12px 40px}
.g-attente{color:var(--ardoise);text-align:center;margin:40px 0}
.g-carte{background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:14px 16px;margin:12px 0}
.g-carte h2{font-size:1.18rem;margin:2px 0 8px;line-height:1.25}
.g-carte h3{font-size:1rem;margin:14px 0 8px}
.g-sous{color:var(--ardoise);margin:-4px 0 10px}
.g-info{background:var(--signal-doux);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.93rem}
.g-info p{margin:4px 0 0}
.g-alerte{background:var(--orange-doux);border-left:4px solid var(--orange);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:.95rem}
.g-bandeau{background:var(--signal-doux);border-radius:10px;padding:8px 11px;margin:8px 0;font-size:.9rem}
.g-bandeau.evalue{background:var(--orange-doux)}
.g-discret{color:var(--ardoise);font-size:.88rem}
.g-postes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 16px}
.g-poste{font:inherit;font-weight:600;font-size:1.05rem;padding:11px 0;border-radius:10px;border:1px solid var(--trait);background:var(--papier);color:var(--encre);cursor:pointer}
.g-poste.on{background:var(--signal);border-color:var(--signal);color:#fff}
/* parties et fil des étapes */
.g-parties{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.g-partie{flex:none;font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;border-radius:10px;
  border:1px solid var(--trait);background:var(--surface);color:var(--encre);cursor:pointer;min-width:92px}
.g-partie b{font-size:.86rem}
.g-partie span{font-size:.76rem;color:var(--ardoise)}
.g-partie.on{border-color:var(--signal);box-shadow:inset 0 -3px 0 var(--signal)}
.g-partie.finie span{color:var(--vert);font-weight:600}
.g-partie.fermee{opacity:.55}
.g-partie:disabled{cursor:default}
.g-fil{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 2px}
.g-pas{font:inherit;font-size:.82rem;font-weight:600;min-width:30px;height:30px;padding:0 6px;border-radius:15px;border:1px solid var(--trait);
  background:var(--surface);color:var(--ardoise);cursor:pointer}
.g-pas.fait{background:var(--vert-doux);border-color:var(--vert);color:var(--vert)}
.g-pas.ici{border-color:var(--signal);color:var(--signal)}
.g-pas.vue{outline:2px solid var(--signal);outline-offset:1px}
.g-pas:disabled{opacity:.45;cursor:default}
/* l'étape */
.g-ou{margin:0;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ardoise)}
.g-moment{margin:-2px 0 10px;font-size:.86rem;color:var(--orange);font-style:italic}
.g-consigne p{margin:6px 0}
.g-consigne .encadre{border-radius:10px;padding:9px 11px;margin:10px 0;font-size:.93rem}
.g-consigne .encadre.attention{background:var(--orange-doux);border-left:4px solid var(--orange)}
.g-consigne .materiel{font-size:.9rem;color:var(--ardoise)}
.g-fig{margin:6px 0 10px;background:#fff;border-radius:10px;border:1px solid var(--trait);padding:4px;text-align:center}
.g-img{max-width:100%;height:auto;display:block;margin:0 auto}
.g-photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.g-photo{max-height:220px;max-width:100%;border-radius:10px;border:1px solid var(--trait);object-fit:contain;background:#fff;flex:1 1 140px}
.g-form{margin:8px 0 4px}
.g-champ{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:7px 0;border-bottom:1px dashed var(--trait)}
.g-champ .l{flex:1 1 180px;font-size:.95rem}
.g-champ .z{display:flex;align-items:center;gap:6px}
.g-champ input,.g-tab input{font:inherit;font-size:1.05rem;width:7.2em;padding:8px 9px;border-radius:9px;border:1.5px solid var(--trait-fort);
  background:var(--surface);color:var(--encre);text-align:right;font-variant-numeric:tabular-nums}
.g-champ .u{min-width:2.6em;color:var(--ardoise);font-size:.92rem}
.g-champ input:disabled,.g-tab input:disabled{background:var(--papier);border-color:var(--trait);color:var(--encre);opacity:1}
input.faux,.g-q.faux{border-color:var(--alerte)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--alerte) 18%,transparent)}
input.manque,.g-q.manque{border-color:var(--orange)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--orange) 18%,transparent)}
.g-tab{overflow-x:auto;margin:6px 0}
.g-tab table{border-collapse:collapse;width:100%}
.g-tab th,.g-tab td{padding:5px 4px;border-bottom:1px solid var(--trait);text-align:center;font-size:.9rem}
.g-tab th:first-child{text-align:left}
.g-tab tbody th{white-space:nowrap}
.g-tab input{width:100%;min-width:4.6em;font-size:1rem;padding:7px 6px}
.g-q{border:1.5px solid var(--trait);border-radius:11px;padding:8px 10px 6px;margin:10px 0}
.g-q legend{font-weight:600;padding:0 4px;font-size:.96rem}
.g-choix{display:flex;gap:9px;align-items:flex-start;padding:7px 4px;border-radius:8px;cursor:pointer}
.g-choix input{margin-top:3px;width:18px;height:18px;flex:none}
.g-choix.pris{background:var(--signal-doux)}
.g-choix.bon{font-weight:600}
.g-choix.bon::after{content:"✓";color:var(--vert);margin-left:auto;font-weight:800}
.g-texte{display:block;margin:10px 0}
.g-texte span{display:block;font-weight:600;font-size:.95rem;margin-bottom:5px}
.g-texte textarea{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;padding:9px 10px;border-radius:10px;border:1.5px solid var(--trait-fort);background:var(--surface);color:var(--encre);resize:vertical}
.g-coche{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px dashed var(--trait);cursor:pointer}
.g-coche input{width:20px;height:20px;flex:none;margin-top:2px}
.g-retour{margin:8px 0;font-size:.95rem}
.g-retour p{margin:4px 0}
.g-retour.ko{background:color-mix(in srgb,var(--alerte) 9%,var(--surface));border-left:4px solid var(--alerte);border-radius:8px;padding:6px 10px}
.g-retour.ok{color:var(--vert);font-weight:700}
.g-retour:empty{display:none}
.g-ok{color:var(--vert);font-weight:700;margin:10px 0}
.g-apres{background:var(--vert-doux);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:.95rem}
.g-apres p,.g-apres ul{margin:5px 0}
.g-prev{background:var(--signal-doux);border-radius:10px;padding:9px 12px;margin:10px 0;font-size:.93rem}
.g-attend{display:flex;gap:10px;align-items:center;background:var(--signal-doux);border-radius:10px;padding:12px;margin:10px 0;font-weight:600}
.tourne{width:18px;height:18px;border-radius:50%;border:3px solid var(--signal);border-right-color:transparent;animation:tourne 1s linear infinite;flex:none}
@keyframes tourne{to{transform:rotate(360deg)}}
.g-code{margin:12px 0 0;font-size:.92rem}
.g-code summary{cursor:pointer;color:var(--ardoise)}
.g-carte .principal,.g-carte .secondaire-bouton{width:100%;margin-top:10px}
/* aides */
.g-aides{background:var(--surface);border:1px dashed var(--trait-fort);border-radius:14px;padding:10px 14px;margin:12px 0}
.g-aides h3{margin:2px 0 8px;font-size:.98rem}
.g-niveaux{display:flex;flex-direction:column;gap:8px}
.g-aide{font:inherit;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;border-radius:10px;
  border:1px solid var(--trait);background:var(--papier);color:var(--encre);cursor:pointer}
.g-aide span{font-size:.85rem;color:var(--ardoise)}
.g-aide:disabled{opacity:.6;cursor:default}
.g-aide.ouverte{display:block;background:var(--signal-doux);border-color:transparent;cursor:default}
.g-aide.ouverte b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--signal);margin-bottom:3px}
.g-aide.ouverte p{margin:3px 0}
.g-res-t{margin:10px 0 4px;font-size:.85rem;color:var(--ardoise)}
.g-res{display:flex;flex-wrap:wrap;gap:6px}
.g-res a{font-size:.88rem;padding:6px 10px;border-radius:999px;border:1px solid var(--trait);text-decoration:none;color:var(--signal);background:var(--papier)}
.g-fin{border-color:var(--vert)}
.g-pied{text-align:center;color:var(--ardoise);font-size:.85rem;padding:10px 0 24px}
@media (max-width:420px){.g-champ input{width:6.4em}.g-postes{grid-template-columns:repeat(4,1fr)}}
.g-champ.texte input{width:9.5em;text-align:left;font-variant-numeric:normal}
.g-consigne .encadre.securite{background:color-mix(in srgb,var(--alerte) 9%,var(--surface));border-left:4px solid var(--alerte)}
.g-consigne .encadre.savoir{background:var(--signal-doux);border-left:4px solid var(--signal)}

</style>
</head>
<body class="guidee">
<header class="g-tete">
  <a class="retour" href="../index.html"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Retour</a>
  <div class="g-titre"><h1>Activité guidée</h1><p>Physique appliquée</p></div>
  <button type="button" class="g-qui" id="qui" hidden></button>
</header>
<main id="app" class="g-app">
  <p class="g-attente" id="attente">Ouverture de l'activité…</p>
</main>
<footer class="pied g-pied"><p>M. Cronenberger</p></footer>
<script src="../acces.js"></script>
<script src="../commun/cles.js?v=65"></script>
<script src="../entrainement/srs.js?v=65"></script>
<script src="../commun/connexion.js?v=64"></script>
<script type="module">
  import("../entrainement/compte.js?v=65").catch(function (e) { console.warn("Compte indisponible :", e && e.message); });
</script>
<script type="module" src="guidee.js?v=655"></script>
<script>/* bouton-retour v1 */(function(a){if(!a)return;a.addEventListener('click',function(e){try{var r=document.referrer;if(r&&new URL(r).origin===location.origin&&!/\/animations\//.test(new URL(r).pathname)&&history.length>1){e.preventDefault();history.back();}}catch(x){}});})(document.querySelector('a.retour,#retourSite'));</script>
</body>
</html>
