<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LatisPro : acquérir, calculer, tracer, modéliser</title>
<style>
:root{
  --bleu:#1F4E79; --bleu-clair:#E6EEF7; --orange:#D9701E; --orange-clair:#FCEBDD;
  --encre:#1B2430; --gris:#5A6675; --fond:#F4F7FB; --carte:#FFFFFF; --filet:#D3DCE7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bleu:#8DB8E8; --bleu-clair:#1C2B3D; --orange:#F0A060; --orange-clair:#3A2718;
    --encre:#E6EBF1; --gris:#A5B0BE; --fond:#11161D; --carte:#1A212B; --filet:#2E3947;}
}
:root[data-theme="dark"]{
  --bleu:#8DB8E8; --bleu-clair:#1C2B3D; --orange:#F0A060; --orange-clair:#3A2718;
  --encre:#E6EBF1; --gris:#A5B0BE; --fond:#11161D; --carte:#1A212B; --filet:#2E3947;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--fond);color:var(--encre);
  font-family:"Segoe UI Variable Text","Segoe UI",Aptos,Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5}
header.page{max-width:1320px;margin:0 auto;padding:22px 20px 10px}
header.page h1{margin:0;font-size:1.65rem;line-height:1.2;color:var(--bleu);font-weight:700;letter-spacing:-.01em}
header.page p{margin:.35rem 0 0;color:var(--gris);font-size:.98rem;max-width:72ch}
.layout{max-width:1320px;margin:0 auto;padding:10px 20px 24px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.viewer{min-width:0}
#wrap{position:relative;width:100%;max-width:960px;border-radius:8px;overflow:hidden;
  box-shadow:0 0 0 1px var(--filet),0 10px 28px rgba(20,40,70,.16);background:#D6D2CA}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;max-width:960px}
.controls button,.controls select{font:inherit;font-size:.95rem;border-radius:6px;border:1px solid var(--filet);
  background:var(--carte);color:var(--encre);padding:7px 14px;cursor:pointer}
.controls button:hover{border-color:var(--bleu)}
.controls button.main{background:var(--bleu);color:#fff;border-color:var(--bleu)}
:root[data-theme="dark"] .controls button.main{color:#10202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .controls button.main{color:#10202F}}
.controls button:disabled{opacity:.4;cursor:default}
.controls .grow{flex:1}
.controls label{font-size:.9rem;color:var(--gris);display:flex;align-items:center;gap:6px}
button:focus-visible,select:focus-visible,.steplist button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.progress{height:4px;background:var(--filet);border-radius:2px;margin-top:10px;max-width:960px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--orange);transition:width .3s}
.panel{background:var(--carte);border:1px solid var(--filet);border-radius:8px;padding:18px 20px}
.panel .part{color:var(--orange);font-weight:600;font-size:.9rem}
.panel h2{margin:.1rem 0 .6rem;font-size:1.3rem;line-height:1.25;color:var(--bleu)}
#stepText p{margin:.55rem 0}
#stepText ul{margin:.4rem 0;padding-left:1.2rem}
#stepText li{margin:.25rem 0}
#stepText code,#stepText kbd{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:.92em}
#stepText code{background:var(--bleu-clair);padding:1px 5px;border-radius:4px}
#stepText kbd{border:1px solid var(--filet);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--fond);white-space:nowrap}
.tip,.warn{margin:.8rem 0;padding:.6rem .8rem;border-radius:6px;font-size:.95rem}
.tip{background:var(--bleu-clair);border-left:4px solid var(--bleu)}
.warn{background:var(--orange-clair);border-left:4px solid var(--orange)}
.tip b:first-child,.warn b:first-child{display:block;margin-bottom:.15rem}
.eq{font-size:1.05rem;text-align:center;margin:.7rem 0;padding:.5rem;border:1px dashed var(--filet);border-radius:6px}
.steplist{margin-top:16px;border-top:1px solid var(--filet);padding-top:12px}
.steplist h3{font-size:.85rem;color:var(--gris);font-weight:600;margin:.6rem 0 .25rem}
.steplist button{display:flex;gap:8px;width:100%;text-align:left;font:inherit;font-size:.92rem;background:none;border:0;color:var(--encre);padding:4px 6px;border-radius:5px;cursor:pointer}
.steplist button span.n{color:var(--gris);min-width:1.4em;text-align:right}
.steplist button:hover{background:var(--fond)}
.steplist button.on{background:var(--bleu-clair);color:var(--bleu);font-weight:600}
.steplist button.done span.n{color:var(--orange)}
footer.page{max-width:1320px;margin:0 auto;padding:6px 20px 28px;color:var(--gris);font-size:.85rem;text-align:center}

/* ============ maquette LatisPro ============ */
#stage{position:absolute;left:0;top:0;width:960px;height:600px;transform-origin:0 0;background:#6E7B8B;overflow:hidden;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:11.5px;color:#000;user-select:none}
#app{position:absolute;inset:0;background:#D6D2CA}
.tbar{position:absolute;left:0;top:0;width:960px;height:22px;background:linear-gradient(#3F7CC4,#1F4F96);color:#fff;
  display:flex;align-items:center;padding:0 5px;font-size:11.5px}
.tbar b{flex:1;font-weight:600}
.tbar i{width:16px;height:14px;background:#D6D2CA;border:1px outset #F0EDE6;font-style:normal;font-size:9px;line-height:12px;text-align:center;margin-left:2px;color:#000}
#menubar{position:absolute;left:0;top:22px;width:960px;height:22px;background:#D6D2CA;display:flex;align-items:center;padding-left:3px}
#menubar span{padding:2px 8px}
#menubar span u{text-decoration:underline}
#menubar span.on{background:#0A246A;color:#fff}
#toolbar{position:absolute;left:0;top:44px;width:960px;height:30px;background:#D6D2CA;border-bottom:1px solid #A9A599;display:flex;align-items:center;gap:2px;padding:0 5px}
.tbtn{width:24px;height:22px;border:1px solid transparent;display:flex;align-items:center;justify-content:center}
.tbtn.on{border:1px inset #fff;background:#C8C4BB}
.tsep{width:1px;height:18px;background:#A9A599;margin:0 3px}
#desk{position:absolute;left:0;top:74px;width:960px;height:504px;background:#5F6B7A}
#status{position:absolute;left:0;top:578px;width:960px;height:22px;background:#D6D2CA;border-top:1px solid #F0EDE6;padding:3px 6px;display:flex;gap:6px}
#status span{border:1px inset #BEBAB2;padding:0 8px;font-size:11px}
#status span:first-child{width:200px}
.win{position:absolute;background:#D6D2CA;border:2px outset #F0EDE6;box-shadow:2px 2px 7px rgba(0,0,0,.4)}
.wtitle{background:linear-gradient(#3F7CC4,#1F4F96);color:#fff;height:18px;line-height:18px;font-size:11px;padding:0 3px;display:flex;align-items:center}
.wtitle.inact{background:linear-gradient(#A6A6A6,#848484)}
.wtitle b{flex:1;font-weight:600}
.wtitle i{width:14px;height:13px;background:#D6D2CA;border:1px outset #F0EDE6;font-style:normal;font-size:9px;line-height:11px;text-align:center;margin-left:2px;color:#000}
.wbody{position:relative;height:calc(100% - 18px);padding:4px;overflow:hidden}
/* boîte de paramétrage */
#param{left:4px;top:78px;width:252px;height:486px}
#ptabs{display:flex;gap:3px;margin-bottom:5px}
#ptabs div{width:78px;height:26px;border:2px outset #F0EDE6;background:#D6D2CA;display:flex;align-items:center;justify-content:center}
#ptabs div.on{border-style:inset;background:#C8C4BB}
.sec{margin-bottom:5px;border:1px solid #A9A599;background:#D6D2CA}
.sec>.h{background:linear-gradient(#C9D4E4,#A9BAD2);font-weight:600;padding:1px 5px;display:flex;justify-content:space-between;font-size:11px}
.sec>.b{padding:5px 6px}
.ea{height:20px;border:2px outset #F0EDE6;background:#D6D2CA;border-radius:9px;text-align:center;line-height:16px;font-size:11px}
.ea.on{border-style:inset;background:#B9D9C1;font-weight:600}
.ea.hot{outline:1px dotted #333;outline-offset:1px}
.tabs3{display:flex;margin-bottom:6px}
.tabs3 div{padding:1px 8px;border:1px solid #A9A599;border-bottom:0;background:#C8C4BB;font-size:11px}
.tabs3 div.on{background:#fff}
.fld{border:1px inset #BEBAB2;background:#fff;padding:0 4px;display:inline-block;min-width:56px;height:17px;line-height:16px}
.cbo{border:1px inset #BEBAB2;background:#fff;padding:0 2px 0 4px;display:inline-flex;justify-content:space-between;align-items:center;width:110px;height:17px}
.cbo b{font-weight:400}
.cbo i{font-style:normal;width:14px;height:13px;border:1px outset #F0EDE6;background:#D6D2CA;text-align:center;line-height:11px;font-size:8px}
.box,.rad{width:12px;height:12px;border:1px inset #9D9A93;background:#fff;display:inline-block;position:relative;vertical-align:-2px;margin-right:4px}
.rad{border-radius:50%}
.box.on::after{content:"";position:absolute;left:3px;top:0;width:3px;height:7px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rowf{display:flex;align-items:center;gap:6px;margin:3px 0}
.rowf span.l{width:52px}
.btn{border:2px outset #F0EDE6;background:#D6D2CA;padding:1px 8px;display:inline-block;text-align:center;font-size:11px}
.btn.hot{border-style:inset;background:#C8C4BB}
/* liste des courbes */
.cl{background:#fff;border:1px inset #BEBAB2;height:410px;padding:4px 5px;overflow:hidden}
.cl h4{margin:0 0 4px;font-size:12px;text-decoration:underline}
.cl .cv{font-weight:700;display:flex;align-items:center;gap:5px}
.cl .cv span{width:8px;height:8px;display:inline-block}
.cl .sub{margin:0 0 4px 13px;color:#444;font-size:10.5px}
.cl .cv.sel{background:#0A246A;color:#fff}
/* graphe */
#graph{left:262px;top:78px;width:468px;height:276px}
#graph .wbody{padding:2px;background:#D6D2CA}
/* fenêtres */
#calc{left:300px;top:400px;width:470px;height:152px;z-index:9}
#calc .code{border:1px inset #BEBAB2;background:#fff;height:74px;padding:3px 6px;font-family:Consolas,"Courier New",monospace;font-size:12px;white-space:pre}
#tabl{left:286px;top:362px;width:470px;height:200px}
#tabl .mini{display:flex;gap:8px;font-size:11px;border-bottom:1px solid #A9A599;padding-bottom:2px;margin-bottom:3px}
#tabl table{border-collapse:collapse;background:#fff;width:100%;font-size:11px}
#tabl td,#tabl th{border:1px solid #BEBAB2;padding:0 4px;height:15px;text-align:left}
#tabl th{background:#D6D2CA;text-align:center;font-weight:600}
#tabl td.n{width:22px;background:#D6D2CA;text-align:center}
#model{left:150px;top:344px;width:760px;height:232px}
#model .drop{border:1px inset #BEBAB2;background:#fff;height:20px;line-height:19px;text-align:center;color:#777}
#model .drop.full{color:#000}
#model .coef{border:1px solid #A9A599;background:#fff;height:88px;font-size:11px}
#model .coef .hd{display:flex;background:#D6D2CA;border-bottom:1px solid #A9A599}
#model .coef .hd span,#model .coef .rw span{padding:0 5px}
#model .coef .rw{display:flex;border-bottom:1px solid #EAEAEA}
#model .out{border:1px inset #BEBAB2;background:#fff;height:17px;line-height:16px;padding:0 5px;margin-top:3px;font-family:Consolas,"Courier New",monospace}
#model .stat{border:1px inset #BEBAB2;background:#fff;height:17px;line-height:16px;padding:0 5px;font-size:11px}
/* menus, popups, dialogues */
.pop{position:absolute;background:#D6D2CA;border:2px outset #F0EDE6;box-shadow:2px 2px 6px rgba(0,0,0,.35);z-index:22;display:none;font-size:11.5px;padding:2px 0}
.pop div{padding:2px 20px 2px 22px;white-space:nowrap;display:flex;justify-content:space-between;gap:24px}
.pop div.hot{background:#0A246A;color:#fff}
.pop div.head{font-weight:600;background:#C8C4BB;color:#000}
.pop hr{border:0;border-top:1px solid #A9A599;margin:2px}
.dlg{position:absolute;z-index:24;display:none}
#dlgCourbe{left:330px;top:180px;width:300px;height:118px}
#dlgVar{left:286px;top:170px;width:392px;height:146px}
#tooltip{position:absolute;background:#FFFFE1;border:1px solid #767676;padding:1px 5px;font-size:11px;z-index:26;display:none}
#ghost{position:absolute;z-index:26;background:#fff;border:1px solid #444;padding:1px 6px;font-size:11px;display:none;pointer-events:none}
#cursor{position:absolute;left:0;top:0;z-index:30;pointer-events:none;will-change:transform}
#cursor .cross{display:none}
#cursor.cross .arrow{display:none}#cursor.cross .cross{display:block}
.ripple{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #E07A1F;z-index:29;pointer-events:none;animation:rip .5s ease-out forwards}
.ripple.r2{border-color:#2F5FC4}
@keyframes rip{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
#keybadge{position:absolute;left:14px;bottom:28px;z-index:31;background:#1F2A37;color:#fff;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600;display:none;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.note{position:absolute;z-index:28;background:#FFF4E8;border:2px solid #D9701E;color:#3A2410;border-radius:6px;padding:5px 9px;font-size:13px;line-height:1.35;max-width:260px;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:noteIn .25s ease-out}
@keyframes noteIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:1px;height:12px;background:#000;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.note,.ripple{animation:none}.ripple{display:none}}

/* ---- correctifs d'après captures d'écran ---- */
.tbar{background:linear-gradient(#EDEFF3,#C9CFD9 55%,#B4BCC9);color:#2A3646;height:24px;justify-content:center;border-bottom:1px solid #8E97A5}
.tbar .logo{font-weight:700;letter-spacing:.06em;color:#4A5568;background:linear-gradient(#FDFDFE,#DDE2EA);border:1px solid #AEB6C2;border-radius:9px;padding:0 16px;font-size:12px}
.tbar .wb{position:absolute;right:6px;display:flex;gap:3px}
.tbar .wb i{width:15px;height:13px;background:linear-gradient(#F4F6F9,#D2D8E1);border:1px solid #9AA3B1;border-radius:2px;font-style:normal;font-size:8px;line-height:11px;text-align:center;color:#3C4655}
#menubar,#toolbar,#status,.wbody,.win{background:#E9ECF1}
#menubar{border-bottom:1px solid #C3C9D3}
#toolbar{background:linear-gradient(#F2F4F7,#DEE3EA);border-bottom:1px solid #B9C0CB;height:34px}
.tbtn{width:26px;height:26px;border-radius:3px}
.tbtn.on{border:1px solid #7F93B5;background:#CBD8EC}
.deco{display:flex;align-items:center;gap:5px;border:1px solid #B9C0CB;background:#EDEFF3;padding:2px 8px;border-radius:3px;font-size:11px}
.digit{margin-left:8px;background:#000;color:#3AA0FF;font-family:Consolas,"Courier New",monospace;font-size:15px;letter-spacing:1px;padding:2px 8px;border:1px solid #444;border-radius:3px}
#desk{background:#F4F5F8}
#status{display:flex;align-items:center;gap:0;padding:2px 4px;background:linear-gradient(#F2F4F7,#DEE3EA)}
#status .stl{border:1px inset #C3C9D3;background:#E9ECF1;width:330px;padding:0 6px;font-size:11px;margin-right:6px}
#status .wtab{padding:1px 14px;font-size:11px;border:1px solid #B9C0CB;border-bottom:0;background:#DDE2EA;margin-right:2px}
#status .wtab.on{background:#4A6EA9;color:#fff;border-color:#3A5989}
/* boîte de paramétrage */
#param{left:4px;top:78px;width:250px;height:492px;border:1px solid #B9C0CB;box-shadow:none}
.sec>.b{padding:4px 6px}
.rowf{margin:2px 0}
.eagrid{gap:4px 2px}
.ea{height:19px;line-height:17px}
#ptabs div{height:28px}
.wtitle{background:linear-gradient(#DCE1E9,#C3CAD6);color:#2A3646;border-bottom:1px solid #AEB6C2}
.wtitle b{font-weight:400}
.wtitle i{background:linear-gradient(#F4F6F9,#D2D8E1);border:1px solid #9AA3B1;border-radius:2px;color:#3C4655}
#ptabs div{width:110px;height:30px;border:1px solid #AEB6C2;border-radius:14px;background:linear-gradient(#FBFCFD,#DCE1E9)}
#ptabs div.on{background:linear-gradient(#CBD8EC,#A9BEDD);border-color:#7F93B5}
.band{background:linear-gradient(#DCE1E9,#C3CAD6);border:1px solid #AEB6C2;text-align:center;padding:1px;margin:4px 0;font-size:11.5px;color:#2A3646}
.sec{border:1px solid #C3C9D3;background:#EFF1F5}
.sec>.h{background:linear-gradient(#DCE1E9,#C6CDD8);color:#2A3646;font-weight:400}
.dif{text-align:center;margin-bottom:5px;font-size:11px}
.eagrid{display:grid;grid-template-columns:1fr 16px 1fr;gap:5px 2px;align-items:center}
.ea{border:1px solid #AEB6C2;border-radius:11px;background:linear-gradient(#FBFCFD,#DCE1E9);height:21px;line-height:19px}
.ea.on{background:linear-gradient(#C9E9D2,#9FD3AE);border-color:#6FA37E;font-weight:600}
.tabs3 div{background:linear-gradient(#EAEDF2,#D5DBE4);border-color:#B9C0CB}
.tabs3 div.on{background:#fff;font-weight:600}
.fld,.cbo{border:1px solid #AEB6C2;background:#fff;border-radius:2px}
.btn{border:1px solid #AEB6C2;border-radius:3px;background:linear-gradient(#FBFCFD,#DCE1E9);padding:2px 10px}
.btn.hot{background:linear-gradient(#CBD8EC,#A9BEDD);border-color:#7F93B5}
.btn.off{color:#9AA3B1}
/* liste des courbes */
.cl{border:1px solid #C3C9D3;background:#fff;height:auto;min-height:330px}
.cl h4{font-size:12.5px}
.cl .cv{font-weight:700;padding:1px 3px}
.cl .cv span.sq{width:8px;height:8px;display:inline-block;margin-right:5px}
.cl .sub{margin-left:14px;color:#555;font-size:10.5px;font-weight:400}
.cl .sep{border-top:1px solid #C3C9D3;margin:14px 0 10px}
.cl .fct{font-family:"Times New Roman",serif;font-size:14px;padding-left:6px}
/* fenêtre graphique (fille MDI, à plat) */
#graph{position:absolute;left:260px;top:78px;width:696px;height:478px;border:1px solid #B9C0CB;background:#fff;box-shadow:none;z-index:2}
#graph .mtitle{height:18px;line-height:17px;background:linear-gradient(#EDEFF3,#D8DDE6);border-bottom:1px solid #C3C9D3;font-size:11px;padding:0 5px;display:flex;justify-content:space-between;color:#4A5568}
#graph .gb{padding:3px;background:#fff}
/* tableur */
#tabl{left:300px;top:170px;width:580px;height:268px;z-index:9}
#tabl .tmenu{display:flex;gap:2px;font-size:11.5px;margin-bottom:3px}
#tabl .tmenu span{padding:1px 8px}
#tabl .tmenu span.on{background:#4A6EA9;color:#fff}
#tabl .ttool{display:flex;align-items:center;gap:3px;border-bottom:1px solid #C3C9D3;padding-bottom:3px;margin-bottom:3px}
#tabl .ttool .ti{width:24px;height:22px;border:1px solid #C3C9D3;border-radius:3px;background:linear-gradient(#FBFCFD,#DCE1E9);display:flex;align-items:center;justify-content:center;font-size:10px}
#tabl .ttool .fxf{flex:1;border:1px solid #AEB6C2;background:#fff;height:20px}
#tabl th,#tabl td{border:1px solid #D2D8E1;height:16px}
#tabl th{background:linear-gradient(#EDEFF3,#DCE1E9);font-weight:400}
#tabl td.n{background:linear-gradient(#EDEFF3,#DCE1E9);text-align:center;width:26px}
/* modélisation */
#model{left:300px;top:200px;height:262px;z-index:9}
#model .mband{background:linear-gradient(#4A6EA9,#37568A);color:#fff;font-size:11px;padding:1px 6px;margin-top:4px}
#model .drop{border:1px solid #AEB6C2;background:linear-gradient(#FBFCFD,#E6EAF0);height:22px;line-height:21px;text-align:center;color:#6B7684;font-size:11px}
#model .drop.full{color:#000}
#model .mbox{border:1px solid #AEB6C2;background:#EFF1F5;padding:6px;display:flex;gap:6px;align-items:center;justify-content:center;min-height:44px}

function renderGraph(){
  const w=GW.w-8,h=GW.h-18-8;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="background:#fff" font-family="Segoe UI,Arial">`;
  for(let k=0;k<=6;k++){const y=gy(k);
    if(k)s+=`<line x1="${GP.L}" x2="${GP.R}" y1="${y}" y2="${y}" stroke="#A8A8A8" stroke-width=".7" stroke-dasharray="1 4"/>`;
    s+=`<text x="${GP.L-6}" y="${y+4}" font-size="10" fill="#333" text-anchor="end">${k}</text>`}
  for(let k=1;k<=5;k++){const x=gx(k*0.01);
    s+=`<line x1="${x}" x2="${x}" y1="${GP.T}" y2="${GP.B}" stroke="#A8A8A8" stroke-width=".7" stroke-dasharray="1 4"/>`}
  for(let k=0;k<=5;k++){const x=gx(k*0.01);
    s+=`<text x="${x}" y="${GP.B+15}" font-size="10.5" fill="#333" text-anchor="middle">${k*10}</text>`}
  // axes : trait plein vertical, zéro en tirets, flèches
  s+=`<line x1="${GP.L}" x2="${GP.L}" y1="${GP.T-14}" y2="${GP.B}" stroke="#000" stroke-dasharray="6 3"/>
      <path d="M${GP.L} ${GP.T-22} l-4 8 h8 z" fill="#000"/>
      <line x1="${GP.L-14}" x2="${GP.R+16}" y1="${GP.B}" y2="${GP.B}" stroke="#000" stroke-dasharray="6 3"/>
      <path d="M${GP.R+24} ${GP.B} l-8 -4 v8 z" fill="#000"/>
      <text x="${GP.R+18}" y="${GP.B-7}" font-size="10.5" fill="#333" text-anchor="end">t en s</text>
      <text x="${GP.R+22}" y="${GP.B+32}" font-size="12" fill="#C0392B" font-weight="700" text-anchor="end">x10<tspan font-size="9" dy="-5">-3</tspan></text>`;
  // noms des ordonnées, en haut à gauche, dans la couleur de la courbe
  let off=0;
  S.series.forEach(k=>{s+=`<text id="lbl_${k}" x="${GP.L+6+off}" y="${GP.T-12}" font-size="10.5" fill="${COL[k]}">${nameOf(k)} en ${UNIT[k]}</text>`;off+=76});
  if(S.model.done&&S.win.model)s+=`<text x="${GP.L+6+off}" y="${GP.T-12}" font-size="10.5" fill="#B0308E">Modèle de ${nameOf('EA0')} en V</text>`;
  const path=(arr,col)=>{let d='';T.forEach((t,i)=>{d+=(i?'L':'M')+gx(t).toFixed(1)+' '+gy(arr[i]).toFixed(1)});
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.1"/>`};
  S.series.forEach(k=>{s+=path(DATA[k],COL[k])});
  const Z=S.model.zone;
  if(Z&&S.win.model){let d='';T.forEach((t,i)=>{if(t>=Z.t1&&t<=Z.t2)d+=(d?'L':'M')+gx(t).toFixed(1)+' '+gy(UC[i]).toFixed(1)});
    if(Z.t2>Z.t1)s+=`<path d="${d}" fill="none" stroke="#FFC400" stroke-opacity=".75" stroke-width="7" stroke-linecap="round"/>`;
    [Z.t1,Z.t2].forEach(t=>{const i=Math.round(t/DUREE*(NP-1));s+=`<circle cx="${gx(t)}" cy="${gy(UC[i])}" r="5" fill="#1B2C4A"/>`})}
  if(S.model.done&&S.win.model){const t1=Z?Z.t1:0,t2=Z?Z.t2:DUREE;let d='';
    for(let q=0;q<=140;q++){const t=t1+q*(t2-t1)/140;
      d+=(q?'L':'M')+gx(t).toFixed(1)+' '+gy(fit.A*(1-Math.exp(-t/fit.tau))).toFixed(1)}
    s+=`<path d="${d}" fill="none" stroke="#B0308E" stroke-width="1.2"/>`}
  if(S.retic!=null){const t=S.retic,i=Math.round(t/DUREE*(NP-1)),v=UC[i];
    const bx=gx(t)+120>GP.R?gx(t)-122:gx(t)+6,by=Math.max(GP.T,gy(v)-28);
    s+=`<line x1="${gx(t)}" x2="${gx(t)}" y1="${GP.T-6}" y2="${GP.B}" stroke="#B08000"/>
        <line x1="${GP.L}" x2="${GP.R}" y1="${gy(v)}" y2="${gy(v)}" stroke="#B08000"/>
        <rect x="${bx}" y="${by}" width="116" height="26" fill="#FFFBE6" stroke="#B08000"/>
        <text x="${bx+5}" y="${by+11}" font-size="10.5">t = ${lp(t,'s')}</text>
        <text x="${bx+5}" y="${by+22}" font-size="10.5">${nameOf('EA0')} = ${lpv(v)} V</text>`}
  $('gbody').innerHTML=s+'</svg>';
}

      <div class="ti" style="width:34px;${T2.showF?'':'background:linear-gradient(#CBD8EC,#A9BEDD)'}" id="b348">3.48</div>

     <div style="flex:1"><div>Nom de l'ordonnée :</div><span class="fld" id="dvNom" style="display:block;height:20px;background:${S.dlgBuf?'#fff':'#4A6EA9'};color:${S.dlgBuf?'#000':'#fff'}">${S.dlgBuf||'Var'}<span class="caret"></span></span></div>
     <div style="width:150px"><div>Unité de l'ordonnée :</div><span class="cbo" style="width:100%"><b>${S.dlgUnit||''}</b><i>▼</i></span></div></div>
    <div style="display:flex;gap:10px;margin-top:22px;align-items:flex-start">
     <div class="sec" style="flex:1"><div class="h"><span>Affichage</span></div>
      <div class="b" style="display:flex;gap:14px;align-items:center;padding:10px 8px">
       <span>Style</span><svg width="30" height="16" id="dvStyle"><path d="M1 13C8 13 10 2 29 2" fill="none" stroke="#C0392B"/></svg>
       <span>Couleur</span><span style="width:64px;height:15px;background:#7D3C98;border:1px solid #9AA3B1"></span></div></div>
     <div style="width:108px;display:flex;flex-direction:column;gap:7px;padding-top:4px">
       <span class="btn ${S.hot==='dvOK'?'hot':''}" id="dvOK">OK</span>
       <span class="btn">Annuler</span></div></div>`;
}
function relPos(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  return{l:(r.left-s.left)/scale,t:(r.top-s.top)/scale,w:r.width/scale,h:r.height/scale}}

/* ---------- échelle ---------- */
let scale=1;
function fitStage(){scale=Math.min(1,wrap.clientWidth/960);stage.style.transform=`scale(${scale})`;wrap.style.height=600*scale+'px'}
window.addEventListener('resize',fitStage);fitStage();

/* ---------- pointeur / contexte d'animation ---------- */
const cur=$('cursor'),ghost=$('ghost');let cx=480,cy=300;
function cursorTo(x,y,ms){cur.style.transition=ms?`transform ${ms}ms cubic-bezier(.45,.05,.3,1)`:'none';
  cur.style.transform=`translate(${x}px,${y}px)`;
  if(ghost.style.display==='block'){ghost.style.transition=cur.style.transition;ghost.style.transform=`translate(${x+14}px,${y+12}px)`}
  cx=x;cy=y}
let TOKEN=0,SPEED=1;const CANCEL={};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mk(tok,anim){
  const chk=()=>{if(tok!==TOKEN)throw CANCEL};
  const c={anim,
    async wait(ms){chk();if(anim&&ms>0){await new Promise(r=>setTimeout(r,ms/SPEED));chk()}},
    async move(p,ms=650){chk();const d=Math.hypot(p.x-cx,p.y-cy),t=Math.min(ms,170+d*1.05);
      cursorTo(p.x,p.y,anim?t/SPEED:0);await c.wait(t+40)},
    ripple(r2){if(!anim||reduced)return;const r=document.createElement('div');r.className='ripple'+(r2?' r2':'');
      r.style.left=cx+'px';r.style.top=cy+'px';stage.appendChild(r);setTimeout(()=>r.remove(),600)},
    center(el){const q=relPos(typeof el==='string'?$(el):el);return{x:q.l+q.w/2,y:q.t+q.h/2}},
    async click(p){if(p)await c.move(p);c.ripple();await c.wait(200)},
    async clickEl(id){await c.click(c.center(id))},
    async hover(id,ms=240){await c.move(c.center(id));S.hot=id;render();await c.wait(ms)},
    async press(id,ms=240){await c.hover(id,ms);c.ripple();await c.wait(180);S.hot=null;render()},
    badge(l){if(!anim)return;const b=$('keybadge');b.textContent=l;b.style.display='block'},
    unbadge(){$('keybadge').style.display='none'},
    async key(l,ms=800){chk();c.badge(l);await c.wait(ms);c.unbadge()},
    async type(set,text,sp=75){for(let k=1;k<=text.length;k++){set(text.slice(0,k));if(anim)render();await c.wait(sp)}render()},
    async menu(name,items){await c.click(c.center(document.querySelector(`#menubar span[data-m="${name}"]`)));
      S.menu=name;render();await c.wait(320);
      for(let k=0;k<items.length;k++){await c.hover(items[k],k===items.length-1?380:200)}
      c.ripple();S.menu=null;S.hot=null;render();await c.wait(200)},
    async ctx(type,p,k,items){await c.move(p);c.badge('Clic droit');c.ripple(true);await c.wait(260);
      S.ctx={type,k,x:Math.min(p.x+4,760),y:p.y+4};render();await c.wait(400);c.unbadge();
      for(let q=0;q<items.length;q++)await c.hover(items[q],q===items.length-1?360:200);
      c.ripple();S.ctx=null;S.hot=null;render();await c.wait(200)},
    async note(where,text,hold=2400){chk();if(!anim)return;
      stage.querySelectorAll('.note').forEach(o=>o.remove());
      const n=document.createElement('div');n.className='note';n.innerHTML=text;
      n.style.left=where.x+'px';n.style.top=where.y+'px';stage.appendChild(n);await c.wait(hold)},
    async drag(fromId,to,label){await c.move(c.center(fromId));c.badge('Glisser-déposer');
      if(anim){ghost.textContent=label;ghost.style.display='block';ghost.style.transition='none';
        ghost.style.transform=`translate(${cx+14}px,${cy+12}px)`}
      await c.wait(240);await c.move(to,900);await c.wait(180);ghost.style.display='none';c.unbadge()}
  };return c}

/* ---------- étapes ---------- */
const acqReady=()=>{S.pane='acq';S.acq={ea:{EA1:true,EA2:true},add:true,perm:false,mode:'Temporelle',pts:'1000',te:'50 µs',tot:'50 ms',src:'EA2',sens:'Montant',seuil:'1 V',pre:'5 %'}};
const acquired=()=>{acqReady();S.pane='courbes';S.win.graph=true;
  S.curves=[{k:'EA0',n:'EA1'},{k:'EA1',n:'EA2'}];S.series=['EA0','EA1']};
const renamed=()=>{acquired();S.curves=[{k:'EA0',n:'uC'},{k:'EA1',n:'uG'}]};
const withI=()=>{renamed();S.curves.push({k:'i',n:'i'});S.calc={txt:'R=10E3\ni=(uG-uC)/R',done:true}};

const STEPS=[
{part:'Acquisition',title:'Choisir les voies d\'acquisition',
 text:`<p>Le circuit est branché sur la carte : la tension aux bornes du condensateur sur la <b>voie 1</b>, celle du générateur sur la <b>voie 2</b>, toutes les masses reliées à celle du boîtier.</p>
<p>Dans la <b>boîte de paramétrage</b>, ouvrir l'onglet d'acquisition (le bouton à la flèche rouge), puis cliquer sur les voies utilisées : elles deviennent vertes. Les voies sélectionnées sont automatiquement placées en ordonnée du graphique, sous les noms EA1, EA2…</p>
<div class="tip"><b>Deux onglets</b>Le premier bouton donne la liste des courbes, le second le paramétrage de l'acquisition. Les cases entre les deux colonnes de voies servent au mode différentiel, qui associe deux entrées pour mesurer une tension sans masse commune.</div>`,
 async run(c){S.pane='courbes';render();await c.wait(300);
  await c.press('tabAcq',300);S.pane='acq';render();await c.wait(400);
  await c.press('ea1');S.acq.ea.EA1=true;render();await c.press('ea2');S.acq.ea.EA2=true;render();await c.wait(400);
  await c.note({x:266,y:150},'Voies actives : elles deviennent<br>les courbes EA1 et EA2',2400);}},
{part:'Acquisition',title:'Régler le mode temporel',
 text:`<p>Trois modes sont proposés : <b>Temporelle</b> (le cas courant), <b>Pas à pas</b>, où l'abscisse est saisie au clavier — pratique pour un dosage — et <b>XY</b>, qui trace une voie en fonction d'une autre.</p>
<p>En mode temporel, on saisit le <b>nombre de points</b> et la <b>durée totale</b> ; le logiciel en déduit la période d'échantillonnage Te = 50 ms ÷ 1000 = 50 µs. Une case <b>Périodique</b> permet d'indiquer un nombre de périodes à enregistrer, et le <b>mode permanent</b> relance l'acquisition en boucle, ce qui transforme le logiciel en oscilloscope.</p>
<div class="tip"><b>Choisir la durée</b>On vise 3 à 5 constantes de temps. Avec R = 10 kΩ et C = 1 µF, τ = RC = 10 ms : 50 ms conviennent.</div>
<p>Méthode commode : cocher d'abord <b>Mode permanent</b> pour vérifier le câblage et les niveaux de tension en direct, arrêter par <kbd>Échap</kbd>, puis le décocher avant l'enregistrement définitif.</p>`,
 async run(c){S.pane='acq';S.acq.ea={EA1:true,EA2:true};render();await c.wait(300);
  await c.click(c.center('mdTemporelle'));S.acq.mode='Temporelle';render();await c.wait(350);
  await c.click(c.center('fPts'));await c.type(v=>S.acq.pts=v,'1000',95);
  await c.click(c.center('fTot'));await c.type(v=>S.acq.tot=v,'50 ms',95);
  S.acq.te='50 µs';render();
  await c.note({x:266,y:300},'Te se met à jour tout seul :<br>50 ms ÷ 1000 = 50 µs',2600);
  await c.click(c.center('bPerm'));S.acq.perm=true;render();await c.wait(600);
  await c.note({x:266,y:330},'Mode permanent : on vérifie<br>le montage en direct…',2000);
  await c.click(c.center('bPerm'));S.acq.perm=false;render();
  await c.note({x:266,y:330},'…puis on le décoche pour<br>l\'enregistrement',2000);}},
{part:'Acquisition',title:'Déclencher, puis lancer avec F10',
 text:`<p>Sans déclenchement, l'enregistrement démarre au moment du clic et le début du phénomène est perdu. On règle donc <b>Source</b> = EA2, <b>Sens</b> = Montant, <b>Seuil</b> = 1 V : après appui sur <kbd>F10</kbd>, l'acquisition attend que EA2 franchisse 1 V en montant, c'est-à-dire le début de la charge.</p>
<p>Un <b>pré-trigger</b> de quelques pour cent fait conserver le court instant qui précède le déclenchement : on voit ainsi l'état initial, condensateur déchargé.</p>
<p>Lancer ensuite par <kbd>F10</kbd> (ou menu Exécuter). Le décompte, en haut à droite, affiche la durée restante. Les courbes s'affichent et les variables EA1 et EA2 rejoignent la liste des courbes.</p>
<div class="tip"><b>Si rien ne se passe</b>Le logiciel attend le déclenchement : vérifier que le signal franchit le seuil, ou l'abaisser. <kbd>Échap</kbd> interrompt l'attente.</div>`,
 async run(c){acqReady();S.acq.src='';S.acq.sens='';S.acq.seuil='';S.acq.pre='';render();await c.wait(300);
  await c.click(c.center('fSrc'));S.acq.src='EA2';render();await c.wait(350);
  await c.click(c.center('fSens'));S.acq.sens='Montant';render();await c.wait(350);
  await c.click(c.center('fSeuil'));await c.type(v=>S.acq.seuil=v,'1 V',110);
  await c.click(c.center('fPre'));await c.type(v=>S.acq.pre=v,'5 %',110);
  await c.note({x:266,y:380},'Départ au début de la charge,<br>avec 5 % d\'enregistrement avant',2200);
  await c.menu('Exécuter',['xAcq']);await c.key('F10',800);
  acquired();render();await c.wait(900);
  await c.note({x:266,y:370},'Deux courbes enregistrées,<br>affichées en fonction du temps',2400);}},
{part:'Courbes',title:'Renommer les courbes',
 text:`<p>EA1 et EA2 ne disent rien de la physique. On renomme chaque courbe par un <b>clic droit sur son nom, en haut de l'axe des ordonnées</b>, puis <b>Propriétés</b>. La boîte « Propriétés de EA1 » permet de changer le <b>nom de l'ordonnée</b> (uC, uG, uR…), son unité, le nom et l'unité de l'abscisse, le style de tracé et la couleur. On termine par <b>Valider</b>.</p>
<p>Deux autres chemins mènent à la même boîte : un <b>double-clic sur le nom</b> de la courbe dans la liste des courbes, ou un <b>clic droit sur le bouton de la voie</b> dans le paramétrage de l'acquisition, puis « Propriétés de la courbe ».</p>
<p>Le même menu contextuel propose <b>Retirer</b> pour enlever la courbe du graphe et <b>Passer sur l'autre ordonnée</b>, utile quand deux grandeurs ont des ordres de grandeur très différents.</p>
<div class="warn"><b>Le faire tout de suite</b>Ces noms servent ensuite dans la feuille de calculs, le tableur et la modélisation : un renommage tardif oblige à reprendre les formules.</div>`,
 async run(c){acquired();render();await c.wait(300);
  await c.ctx('ord',{x:sx(0)+26,y:GW.y+18+3+GP.T-16},'EA0',['cRet','cProp']);
  S.dlg='courbe';S.dlgOld='EA1';S.dlgKey='EA0';S.dlgBuf='EA1';render();await c.wait(400);
  await c.click(c.center('dcNom'));S.dlgBuf='';render();await c.type(v=>S.dlgBuf=v,'uC',140);
  await c.press('dcOK',300);S.curves[0].n='uC';S.dlg=null;render();await c.wait(500);
  await c.ctx('ord',{x:sx(0)+102,y:GW.y+18+3+GP.T-16},'EA1',['cProp']);
  S.dlg='courbe';S.dlgOld='EA2';S.dlgKey='EA1';S.dlgBuf='EA2';render();await c.wait(300);
  await c.click(c.center('dcNom'));S.dlgBuf='';render();await c.type(v=>S.dlgBuf=v,'uG',140);
  await c.press('dcOK',300);S.curves[1].n='uG';S.dlg=null;render();await c.wait(400);
  await c.press('tabCourbes',260);S.pane='courbes';render();
  await c.note({x:16,y:520},'Dans la liste : uC, avec son<br>abscisse fct(Temps)',2400);}},
{part:'Courbes',title:'Afficher, retirer, changer l\'abscisse',
 text:`<p>L'affichage se fait par <b>glisser-déposer</b> depuis la liste des courbes vers la fenêtre graphique. Déposer la courbe sur le graphe la place en ordonnée ; la déposer <b>sous l'axe des abscisses</b> la place en abscisse, ce qui permet de tracer par exemple uC = f(i).</p>
<p>Pour l'enlever : clic droit sur son nom, puis <b>Retirer</b>. La touche <kbd>Suppr</kbd>, elle, supprime la courbe <b>et la variable</b> : à éviter.</p>
<div class="tip"><b>fct(Temps)</b>Une courbe notée uC fct(Temps) a déjà le temps en abscisse. Une variable sans mention d'abscisse ne peut pas être tracée telle quelle.</div>
<p>Pour deux grandeurs d'ordres de grandeur différents — une tension en volts et une intensité en milliampères, par exemple — déposer la seconde <b>à droite du graphe</b> crée un second axe. Un double-clic sur un axe permet d'en régler l'échelle, et de faire coïncider les deux zéros.</p>`,
 async run(c){renamed();S.series=['EA0'];render();await c.wait(400);
  await c.note({x:16,y:520},'Seule uC est affichée',1600);
  await c.drag('cv_EA1',{x:sx(0.025),y:sy(3)},'uG');S.series=['EA0','EA1'];render();await c.wait(700);
  await c.note({x:266,y:370},'uG reste à 5 V : c\'est l\'échelon<br>qui charge le condensateur',2600);}},
{part:'Courbes',title:'Calibrer et mesurer sur le graphe',
 text:`<p>Un clic droit sur le graphe ouvre le menu des outils graphiques : <b>Calibrage</b> (bornes des axes), <b>Réticule</b>, <b>Pointeur</b>, loupes, <b>Tangente</b>, création de flèches et de commentaires.</p>
<p>On peut aussi agir directement sur les axes : au-delà de la ligne médiane d'un axe on modifie l'échelle, en deçà on déplace l'origine.</p>
<p>Le <b>réticule</b> donne les coordonnées d'un point : ici uC ≈ 3,2 V à t = 10 ms, soit 63 % de 5 V — on retrouve la constante de temps.</p>
<div class="tip"><b>Mesures automatiques</b>Le menu Outils affiche mini, maxi, valeur moyenne, période, fréquence et valeur efficace d'une courbe périodique.</div>`,
 async run(c){renamed();render();await c.wait(300);
  await c.ctx('graph',{x:sx(0.03),y:sy(2)},null,['gCal','gRet']);
  cur.classList.add('cross');
  await c.move({x:sx(0.004),y:sy(1.5)});S.retic=0.004;render();await c.wait(500);
  await c.move({x:sx(0.01),y:sy(3.2)},900);S.retic=0.01;render();await c.wait(800);
  await c.note({x:266,y:370},'t = 10 ms → uC ≈ 3,2 V,<br>soit 63 % de 5 V',2800);
  await c.move({x:sx(0.042),y:sy(5)},900);S.retic=0.042;render();cur.classList.remove('cross');await c.wait(600);
  await c.note({x:266,y:370},'Après 4 à 5 τ, la charge<br>est terminée',2200);}},
{part:'Tableur',title:'Créer une grandeur par le calcul',
 text:`<p><b>Traitements ▸ Feuille de calculs</b> (<kbd>F3</kbd>) permet de déclarer des constantes et de créer des grandeurs à partir de celles qui ont été acquises. Une ligne par calcul (on passe à la ligne avec <kbd>Entrée</kbd>), puis <b>Calcul ▸ Exécuter</b> ou <kbd>F2</kbd>.</p>
<p>Ici l'intensité n'est pas mesurée ; on la calcule à partir de la tension aux bornes du conducteur ohmique, en déclarant d'abord la résistance comme constante :</p>
<div class="eq">R=10E3<br>i=(uG-uC)/R</div>
<p><code>10E3</code> vaut 10 × 10<sup>3</sup> Ω. Des fonctions sont disponibles : <code>Exp(x)</code>, <code>Sqrt(x)</code>, <code>Deriv(C;N)</code> pour une dérivée…</p>
<p>La colonne de droite donne le résultat de chaque ligne : la valeur d'une constante (<code>R = 10E3</code>), ou <code>[1000]</code> pour une grandeur calculée en 1000 points. La constante apparaît aussi dans la liste des courbes, sous <b>Scalaires</b>.</p>
<div class="warn"><b>« i = ? » dans la colonne de droite</b>La formule est incalculable : vérifier les noms des courbes, les parenthèses, et ne pas oublier les <code>*</code> (écrire <code>m*g*z</code>, pas <code>mgz</code> ; <code>v^2</code>, pas <code>v²</code>). Pas d'unité dans la feuille de calculs.</div>`,
 async run(c){renamed();render();await c.wait(200);
  await c.menu('Traitements',['mTab','mFdc']);S.win.calc=true;render();await c.wait(500);
  await c.click(c.center('codeZone'));
  await c.type(v=>S.calc.txt=v,'R=10E3\ni=(uG-uC)/R',70);
  await c.key('F2',900);S.calc.done=true;S.curves.push({k:'i',n:'i'});render();await c.wait(600);
  await c.note({x:590,y:320},'Résultats : R = 10E3,<br>i calculée en 1000 points',2400);
  await c.note({x:16,y:520},'R est rangée dans Scalaires,<br>i rejoint la liste des courbes',2400);}},
{part:'Tableur',title:'Lire des valeurs, en saisir à la main',
 text:`<p><b>Traitements ▸ Tableur</b> (<kbd>F11</kbd>). Pour afficher une grandeur, on la fait glisser depuis la liste des courbes vers une colonne ; l'abscisse s'obtient en glissant <b>Temps</b> de la même façon. Un clic droit sur une colonne, puis <b>Retirer</b>, l'enlève du tableur sans supprimer la variable.</p>
<p>Pour afficher le temps, on fait glisser la mention <b>fct(Temps)</b> associée à une courbe — ou, plus simplement, on double-clique sur l'en-tête de la colonne de cette courbe. Les lignes sont numérotées à partir de 0 ; la bande <b>Constante(s)</b>, à droite, s'ouvre pour afficher les constantes.</p>
<div class="tip"><b>Puissances de dix</b>À la saisie, <code>E</code> remplace « × 10 puissance » : <code>2,2E-3</code> vaut 2,2 × 10<sup>−3</sup>.</div>`,
 async run(c){withI();render();await c.wait(200);
  await c.menu('Traitements',['mTab']);S.win.tabl=true;render();await c.wait(500);
  await c.drag('cv_i',{x:430,y:400},'i');S.tabl.cols=['i'];render();await c.wait(500);
  await c.drag('cv_Temps',{x:520,y:400},'Temps');S.tabl.cols=['i','Temps'];render();await c.wait(600);
  await c.note({x:560,y:470},'Les valeurs de i, invisibles<br>dans la feuille de calculs, apparaissent',2600);}},
{part:'Tableur',title:'Créer une variable dans le tableur',
 text:`<p>On veut la puissance reçue par le condensateur, p = uC × i. Menu du tableur <b>Variables ▸ Nouvelle</b> : la boîte « Propriétés de Var » demande le <b>nom de l'ordonnée</b> et son <b>unité</b>. Après validation, une colonne vide apparaît.</p>
<p>On <b>sélectionne la colonne</b> en cliquant sur la case qui porte son nom — la formule s'appliquera ainsi à toutes les cellules — puis on tape la formule dans la case <b>fx</b> et on valide :</p>
<div class="eq">=uC*i</div>
<div class="warn"><b>Toute formule commence par « = »</b>Sans lui, le tableur prend la saisie pour du texte. Pour éviter les fautes de frappe, on peut faire glisser les noms des variables depuis la liste des courbes jusque dans la case fx.</div>
<p>Les boutons <b>3.48</b> et <b>Fx</b> basculent l'affichage entre les valeurs et les formules. Sans carte d'acquisition, c'est la même démarche : on crée ses variables, on tape les mesures au clavier, puis on trace et on modélise.</p>`,
 async run(c){withI();S.win.tabl=true;S.tabl.cols=['i','Temps'];render();await c.wait(300);
  await c.click(c.center('tmVariables'));S.tabl.menu='Variables';render();await c.wait(450);
  await c.hover('vTout',220);await c.hover('vNouv',380);c.ripple();
  S.tabl.menu=null;S.hot=null;S.dlg='var';S.dlgBuf='';S.dlgUnit='';render();await c.wait(500);
  await c.type(v=>S.dlgBuf=v,'P',160);S.dlgUnit='Watt (W)';render();await c.wait(400);await c.press('dvOK',300);
  S.dlg=null;S.curves.push({k:'P',n:'P'});S.tabl.cols.push('P');render();await c.wait(500);
  await c.click(c.center('col_P'));S.tabl.selCol='P';render();await c.wait(400);
  await c.note({x:560,y:470},'Colonne sélectionnée : la formule<br>vaudra pour toutes ses cellules',2200);
  await c.click(c.center('fxField'));S.tabl.fxEdit=true;render();
  await c.type(v=>S.tabl.fx=v,'=uC*i',140);
  await c.key('⏎ Entrée',600);S.tabl.fxEdit=false;S.tabl.pDone=true;render();await c.wait(500);
  await c.note({x:560,y:470},'Les valeurs de P sont calculées<br>ligne par ligne',2400);}},
{part:'Modélisation',title:'Ouvrir la modélisation',
 text:`<p><b>Traitements ▸ Modélisation</b>. On fait glisser la courbe à modéliser depuis la liste des courbes vers la zone <b>Glisser la courbe source ici…</b> : la zone <b>Courbe modèle</b> se remplit toute seule avec « Modèle de uC », courbe qui viendra se superposer aux points.</p>
<div class="warn"><b>Une courbe, pas une variable</b>Il faut déposer une courbe de la forme y = fct(x), par exemple uC fct(Temps). Une variable sans abscisse ne peut pas être modélisée : il faut d'abord lui en donner une dans une fenêtre graphique.</div>`,
 async run(c){withI();render();await c.wait(200);
  await c.menu('Traitements',['mFdc','mMod']);S.win.model=true;render();await c.wait(500);
  await c.drag('cv_EA0',c.center('drop'),'uC');S.model.drop='uC fct(Temps)';render();await c.wait(700);
  await c.note({x:170,y:300},'La courbe source est déposée',1800);}},
{part:'Modélisation',title:'Choisir le modèle et calculer',
 text:`<p>Le bouton <b>Choisir un modèle</b>, actif seulement une fois la courbe déposée, ouvre la fenêtre « Sélectionner un modèle… » : Constante, <b>Linéaire</b> (y = ax, la droite qui passe par l'origine), <b>Affine</b> (y = ax + b), Polynôme, Parabole, Puissance, Exponentiel en X, Exponentiel en 1/X, puis, en faisant défiler, les exponentielles croissante et décroissante, la sinusoïde…</p>
<p>Le choix se fait d'après la <b>physique</b>, pas d'après l'allure la plus flatteuse : proportionnalité → Linéaire ; charge ou décharge d'un condensateur → exponentielle ; régime sinusoïdal → sinusoïde. Ici uC = E(1 − e<sup>−t/τ</sup>) : <b>Exponentiel croissant</b>.</p>
<p>Il reste à <b>délimiter la zone à modéliser</b> : fenêtre de modélisation ouverte, le pointeur devient une <b>cible rouge</b> au-dessus du graphe. Un clic sur le premier point, un clic sur le dernier : la portion retenue passe en surbrillance, encadrée de deux gros points. On exclut ainsi ce qui ne relève pas de la loi étudiée, par exemple l'instant qui précède la fermeture de l'interrupteur.</p>
<p>Cliquer ensuite sur <b>Calculer le modèle</b>, puis sur <b>&gt;&gt;</b> pour développer la fenêtre et accéder aux coefficients.</p>
<div class="tip"><b>Si le modèle ne converge pas</b>Déplacer les bornes, puis relancer le calcul.</div>`,
 async run(c){withI();S.win.model=true;S.model.drop='uC fct(Temps)';S.model.scroll=0;render();await c.wait(300);
  await c.press('bChoose',300);S.model.pop=true;render();await c.wait(450);
  await c.hover('mo1',260);await c.hover('mo5',220);
  await c.hover('moDown',200);c.ripple();S.model.scroll=2;render();await c.wait(260);
  c.ripple();S.model.scroll=4;render();await c.wait(300);
  await c.hover('mo8',420);c.ripple();
  S.model.pop=false;S.model.mod='Exponentiel croissant';S.hot=null;render();await c.wait(500);
  await c.note({x:170,y:300},'Le modèle se choisit<br>d\'après la loi physique',2200);
  cur.classList.add('target');
  await c.click({x:sx(0.001),y:sy(0.1)});S.model.zone={t1:0.001,t2:0.001};render();await c.wait(300);
  await c.click({x:sx(0.049),y:sy(4.97)});S.model.zone={t1:0.001,t2:0.049};render();await c.wait(400);
  cur.classList.remove('target');
  await c.note({x:266,y:250},'Portion retenue : en surbrillance,<br>encadrée de deux gros points',2400);
  await c.press('bCalcMod',320);S.model.done=true;render();await c.wait(900);
  await c.note({x:170,y:300},'La courbe modèle se superpose<br>aux points de mesure',2400);
  await c.press('bDev',300);S.model.dev=true;render();await c.wait(900);}},
{part:'Modélisation',title:'Exploiter les coefficients',
 text:`<p>Le bouton <b>&gt;&gt;</b> développe la fenêtre : elle donne l'équation littérale, l'équation avec les valeurs, le tableau des <b>coefficients</b> (que l'on peut désactiver ou imposer avec la case Actif), et deux indicateurs de validité, l'<b>Ecart Type</b> et le <b>Coefficient de Corrélation</b>, d'autant meilleur qu'il est proche de 1. Le bouton <b>Copier le résultat vers le presse-papier</b> permet de coller tout cela dans un compte rendu.</p>
<div class="eq">uC = A (1 − e<sup>−t/τ</sup>)&nbsp;&nbsp;avec&nbsp;&nbsp;A = ${AV} V&nbsp;&nbsp;et&nbsp;&nbsp;τ = ${TAUms} ms</div>
<p>Il reste à traduire : <b>A</b> est la tension finale, celle du générateur ; <b>τ</b> est la constante de temps. La valeur théorique vaut RC = 10 kΩ × 1 µF = 10 ms. Un écart de quelques pour cent est normal — la tolérance d'un condensateur atteint couramment 10 à 20 %.</p>
<p>Rédaction attendue : « La modélisation donne τ = ${TAUms} ms, cohérente avec RC = 10 ms calculée à partir des valeurs nominales. »</p>
<div class="warn"><b>Un bon coefficient ne valide pas tout</b>Un modèle mal choisi peut coller aux points sur une portion réduite. On vérifie que la courbe modèle suit les points sur tout l'enregistrement.</div>`,
 async run(c){withI();S.win.model=true;S.model={drop:'uC fct(Temps)',mod:'Exponentiel croissant',done:true,dev:true,pop:false,scroll:4,zone:{t1:0.001,t2:0.049}};render();await c.wait(400);
  await c.move({x:700,y:420});
  await c.note({x:150,y:300},`A = ${AV} V : la tension finale`,2200);
  await c.move({x:700,y:440});
  await c.note({x:150,y:300},`τ = ${TAUms} ms, à comparer<br>à RC = 10 ms`,2600);}},
{part:'Bilan',title:'À retenir',
 text:`<ul><li>Boîte de paramétrage : voies EA0, EA1…, mode temporel, nombre de points et durée totale (Te s'en déduit).</li>
<li>Déclenchement : source, sens, seuil — sinon le début du phénomène est perdu. Lancement par <kbd>F10</kbd>.</li>
<li>Renommer les courbes par clic droit sur le nom en ordonnée, puis Propriétés, avant tout calcul.</li>
<li>Glisser-déposer : depuis la liste des courbes vers le graphe (ordonnée), sous l'axe (abscisse) ou vers une colonne du tableur.</li>
<li>Feuille de calculs (<kbd>F3</kbd>, exécution par <kbd>F2</kbd>) pour les grandeurs non mesurées ; leurs valeurs ne s'affichent que dans le tableur ou sur un graphe.</li>
<li>Tableur (<kbd>F11</kbd>) : glisser les courbes vers les colonnes ; Variables ▸ Nouvelle, sélection de la colonne, puis formule commençant par « = » dans la case fx.</li>
<li>Modélisation : glisser la courbe, choisir le modèle d'après la loi physique, délimiter la zone par deux clics, calculer, développer, puis traduire les coefficients en grandeurs physiques avec leurs unités.</li></ul>`,
 async run(c){withI();S.win.model=true;S.model={drop:'uC fct(Temps)',mod:'Exponentiel croissant',done:true,dev:true,pop:false,scroll:4,zone:{t1:0.001,t2:0.049}};render();await c.wait(200)}}
];

/* ---------- navigation ---------- */
let cur_i=0;const done=new Set();
function clearFx(){stage.querySelectorAll('.note,.ripple').forEach(n=>n.remove());
  $('keybadge').style.display='none';ghost.style.display='none';cur.classList.remove('cross');cur.classList.remove('target')}
async function go(k){
  k=Math.max(0,Math.min(STEPS.length-1,k));cur_i=k;const tok=++TOKEN;clearFx();S=freshState();showText(k);
  try{
    for(let i=0;i<k;i++){await STEPS[i].run(mk(tok,false));S.hot=null;S.menu=null;S.ctx=null;S.dlg=null;S.tabl.menu=null;S.model.pop=false}
    S.win={graph:true,calc:false,tabl:false,model:false};S.retic=null;render();
    await STEPS[k].run(mk(tok,true));
    done.add(k);showList();
    if($('auto').checked&&k<STEPS.length-1){await mk(tok,true).wait(2200);go(k+1)}
  }catch(e){if(e!==CANCEL)console.error(e)}
}
function showText(k){const s=STEPS[k],parts=['Acquisition','Courbes','Tableur','Modélisation'];
  $('partLbl').textContent=s.part==='Bilan'?'Bilan':'Partie '+(parts.indexOf(s.part)+1)+' : '+s.part;
  $('stepTitle').textContent=`${k+1}. ${s.title}`;$('stepText').innerHTML=s.text;
  $('bPrev').disabled=k===0;$('bNext').disabled=k===STEPS.length-1;
  $('prog').style.width=((k+1)/STEPS.length*100)+'%';showList()}
function showList(){let h='',part='';STEPS.forEach((s,i)=>{if(s.part!==part){part=s.part;h+=`<h3>${part}</h3>`}
  h+=`<button data-i="${i}" class="${i===cur_i?'on':''} ${done.has(i)?'done':''}"><span class="n">${i+1}</span>${s.title}</button>`});
  $('stepList').innerHTML=h}
$('stepList').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)go(+b.dataset.i)});
$('bPrev').onclick=()=>go(cur_i-1);$('bNext').onclick=()=>go(cur_i+1);$('bReplay').onclick=()=>go(cur_i);
$('speed').onchange=e=>{SPEED=+e.target.value};
document.addEventListener('keydown',e=>{if(e.target.closest('select,input'))return;
  if(e.key==='ArrowRight')go(cur_i+1);else if(e.key==='ArrowLeft')go(cur_i-1)});
S=freshState();render();cursorTo(480,300,0);go(0);
})();
</script>
</body>
</html>
