<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harmocem : la pollution harmonique pas à pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --armoire:#cdd2cf; --armoire-2:#bfc5c2; --papier:#ffffff; --encre:#1d2830; --encre-2:#4a5963;
  --surligneur:#ffe34d; --focus:#1f6feb; --panneau:#f3f5f4; --trait:#9aa4a0;
  --ok:#1f9d55; --ko:#d33a2c;
  --f-texte:"Barlow",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-titre:"Barlow Condensed","Arial Narrow",system-ui,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --armoire:#20262a; --armoire-2:#2a3136; --encre:#e8ecea; --encre-2:#aab6b1; --panneau:#161b1e; --trait:#4b5559; }}
:root[data-theme="dark"]{ --armoire:#20262a; --armoire-2:#2a3136; --encre:#e8ecea; --encre-2:#aab6b1; --panneau:#161b1e; --trait:#4b5559; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%} body{margin:0;height:100%;background:var(--armoire);color:var(--encre);font-family:var(--f-texte);font-size:16px;line-height:1.5}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--armoire-2);border-bottom:1px solid var(--trait)}
header h1{font-family:var(--f-titre);font-weight:700;font-size:1.35rem;letter-spacing:.01em;margin:0;line-height:1.1}
.folios{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap}
.folio{font-family:var(--f-titre);font-size:.95rem;font-weight:600;border:1px solid var(--trait);background:var(--panneau);color:var(--encre);border-radius:4px;padding:.25rem .6rem;cursor:pointer}
.folio b{font-weight:700;margin-right:.3rem}
.folio[aria-current="true"]{background:var(--encre);color:var(--armoire);border-color:var(--encre)}
.corps{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.scene{position:relative;min-height:0;padding:.8rem;display:flex;flex-direction:column;gap:.5rem}
.plan-wrap{position:relative;flex:1;min-height:0;background:var(--papier);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 28px -14px rgba(0,0,0,.45);overflow:hidden}
#plan{width:100%;height:100%;display:block;touch-action:manipulation}
#page{transition:opacity .25s}
.outils{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.legende{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.82rem;color:var(--encre-2)}
.legende span{display:inline-flex;align-items:center;gap:.3rem}
.legende i{display:inline-block;width:18px;height:6px;border-radius:3px}
.btn{font-family:var(--f-titre);font-weight:600;font-size:1rem;border:1px solid var(--encre);background:var(--encre);color:var(--armoire);border-radius:4px;padding:.45rem .9rem;cursor:pointer}
.btn.leger{background:transparent;color:var(--encre)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
aside{background:var(--panneau);border-left:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.notes{padding:1.1rem 1.2rem .6rem;overflow:auto;flex:1}
.compteur{font-family:var(--f-titre);font-weight:600;color:var(--encre-2);font-size:.95rem}
.notes h2{font-family:var(--f-titre);font-weight:700;font-size:1.6rem;line-height:1.1;margin:.15rem 0 .7rem}
.notes p{margin:0 0 .7rem;max-width:62ch}
.notes b{font-weight:600}
.nav{display:flex;gap:.5rem;padding:.7rem 1.2rem;border-top:1px solid var(--trait);align-items:center}
.nav .btn{flex:1}
.piste{display:flex;gap:3px;padding:0 1.2rem .8rem}
.piste button{flex:1;height:8px;border:0;border-radius:2px;background:var(--trait);opacity:.45;cursor:pointer;padding:0}
.piste button.vu{opacity:.8}.piste button[aria-current="true"]{background:var(--encre);opacity:1}
/* widget gradateur */
.gw{margin:.4rem 0 .8rem;background:var(--papier);border:1px solid var(--trait);border-radius:4px;padding:.6rem;color:#1d2830}
.gw svg{width:100%;height:auto;display:block}
.gw label{display:flex;align-items:center;gap:.6rem;font-family:var(--f-titre);font-weight:600;margin-top:.4rem}
.gw input{flex:1;accent-color:#d33a2c}
.gw .val{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-top:.4rem;font-size:.85rem}
.gw .val div{background:#f1f3f2;border-radius:3px;padding:.25rem .4rem}
.gw .val strong{display:block;font-family:var(--f-titre);font-size:1.15rem}
/* surimpressions */
.zone rect{fill:var(--surligneur);fill-opacity:.28;stroke:#1d2830;stroke-opacity:.75}
.zone text,.badge text{font-family:var(--f-titre);font-weight:700;fill:#1d2830;paint-order:stroke;stroke:#fff;stroke-linejoin:round}
.fil{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fil.fond{stroke-opacity:.85}
.anneau{stroke-opacity:.95}
.fil.flux{stroke:#fff;stroke-opacity:.95}
.apparait{animation:app .45s ease-out both}
@keyframes app{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.apparait{animation:none}}
@media (max-width:860px){
  .corps{grid-template-columns:1fr;grid-template-rows:minmax(300px,52vh) auto}
  aside{border-left:0;border-top:1px solid var(--trait)}
  .notes{overflow:visible}
  header h1{font-size:1.15rem}
  .folio span{display:none}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Harmocem : la pollution harmonique pas à pas</h1>
  <nav class="folios" aria-label="Parties"></nav>
</header>
<div class="corps">
  <section class="scene" aria-label="Photo du banc">
    <div class="plan-wrap">
      <svg id="plan" viewBox="0 0 1260 1888" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Face avant du banc Harmocem">
        <image id="page" x="0" y="0" width="1260" height="1888" href=""/>
        <g id="hl"></g>
      </svg>
    </div>
    <div class="outils">
      <button class="btn leger" id="vue" type="button">Voir la page entière</button>
      <div class="legende" aria-label="Légende"><span><i style="background:#1f6feb"></i>point de mesure 1</span><span><i style="background:#15803d"></i>U2</span><span><i style="background:#d9480f"></i>U3/I3</span><span><i style="background:#8e44ad"></i>moteur</span></div>
    </div>
  </section>
  <aside>
    <div class="notes" aria-live="polite">
      <div class="compteur" id="compteur"></div>
      <h2 id="titre"></h2>
      <div id="texte"></div>
      <div id="widget"></div>
    </div>
    <div class="piste" id="piste" aria-label="Étapes"></div>
    <div class="nav">
      <button class="btn leger" id="prec" type="button">Précédent</button>
      <button class="btn" id="suiv" type="button">Suivant</button>
    </div>
  </aside>
</div>
</div>

const STEPS=[{"page": 1, "view": [0, 0, 1260, 1888], "title": "Le banc Harmocem", "text": "<p>La face avant est le <b>schéma de puissance</b> du banc : le réseau monophasé 230 V arrive en haut, traverse les filtres, et alimente en bas un variateur (Altivar 31) et son moteur, ainsi que l'éclairage de la partie opérative.</p>\n<p>Quatre <b>points de mesure</b> jalonnent le trajet : <b>U1/I1</b> à l'entrée, <b>U2</b> après la self L1, <b>U3/I3</b> au départ des récepteurs, <b>UM/IM</b> au moteur.</p>", "zones": [], "rings": [{"ring": [550, 510, 34], "c": "#1f6feb"}, {"ring": [540, 700, 30], "c": "#15803d"}, {"ring": [550, 1040, 34], "c": "#d9480f"}, {"ring": [540, 1560, 30], "c": "#8e44ad"}], "wires": [], "badges": [], "img": null}, {"page": 1, "view": [300, 380, 700, 320], "title": "Le point de référence : U1 et I1", "text": "<p>L'analyseur de réseau se branche ici : <b>tension sur U1</b>, <b>pince sur I1</b>. C'est ce que l'installation <b>prélève au réseau</b>, donc ce qui intéresse le distributeur et les autres usagers.</p>\n<p>On y lit le courant, son allure, son spectre, le THD, les puissances et le facteur de puissance.</p>", "zones": [], "rings": [{"ring": [550, 510, 40], "c": "#1f6feb"}], "wires": [], "badges": [], "img": null}, {"page": 1, "view": [0, 0, 1260, 1888], "title": "Qui pollue : la lampe ou le gradateur ?", "text": "<p>Lampe halogène seule : le courant est une <b>sinusoïde</b>, THD 1,8 %. Une lampe à incandescence est une résistance.</p>\n<p>Même lampe à travers un <b>gradateur</b> à mi-course : le courant est découpé, THD 55 %. Le pollueur est le <b>convertisseur</b>, pas la charge.</p>", "zones": [], "rings": [], "wires": [], "badges": [], "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUAAAALQCAIAAABufD4jAAAqsUlEQVR4nO2dW5KsqBZA4UbPo3P+o6oeifeDKoriJW/ZuFacOJFl+iCV5d4gqv76+lIAIJN/3D8+n8/AVXNqAJjNr8Cfz2escsNXCAAe2jgWyuZG42YPcRhgKv+Ek4y6rnjhFADYgf95f5uY6blqpoxtIbtr+/wQzuNN/ziE6wn/hEmEuz16BNXdgS5ZJLqh/IGuqhWFpdoTvxMrE2aNw0PisLez7DpLPpMIPE6oR/ const PARTIES=[[0,'Mesurer'],[4,'Filtrer']];
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('plan'), hl=document.getElementById('hl'), img=document.getElementById('page');
const reduit=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0, pageCur=0, vb=[0,0,1260,1888], pleine=false, vus=new Set(), flux=[];
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
// folios
const nf=document.querySelector('.folios');
PARTIES.forEach(([n,l],k)=>{const b=document.createElement('button');b.className='folio';b.type='button';b.dataset.p=k;b.innerHTML='<b>'+(k+1)+'</b><span>'+l+'</span>';b.onclick=()=>aller(n);nf.appendChild(b)});
// piste
const piste=document.getElementById('piste');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.title=(i+1)+'. '+s.title;b.setAttribute('aria-label','Étape '+(i+1)+' : '+s.title);b.onclick=()=>aller(i);piste.appendChild(b)});
function k(){const r=svg.getBoundingClientRect();return Math.max(vb[2]/r.width,vb[3]/r.height)}
function styliser(){const s=k();
  hl.querySelectorAll('.fil.fond').forEach(p=>p.setAttribute('stroke-width',9*s*(+p.dataset.w||1)));
  hl.querySelectorAll('.anneau').forEach(c=>c.setAttribute('stroke-width',4*s));
  hl.querySelectorAll('.fil.flux').forEach(p=>{p.setAttribute('stroke-width',3.2*s);p.setAttribute('stroke-dasharray',(1.5*s)+' '+(12*s))});
  hl.querySelectorAll('.zone rect').forEach(r=>{r.setAttribute('stroke-width',1.6*s);r.setAttribute('rx',4*s)});
  const fs=svg.getBoundingClientRect().width<520?11:14;hl.querySelectorAll('text').forEach(t=>{t.setAttribute('font-size',fs*s);t.setAttribute('stroke-width',4*s)});
  hl.querySelectorAll('.zone text').forEach(t=>placer(t,s));
  hl.querySelectorAll('.badge').forEach(g=>{const c=g.querySelector('circle');c.setAttribute('r',5*s);const t=g.querySelector('text');t.setAttribute('x',+c.getAttribute('cx')+8*s);t.setAttribute('y',+c.getAttribute('cy')+5*s)});
}
function placer(t,s){const[x,y,w,h]=JSON.parse(t.dataset.r),p=t.dataset.pos;let tx,ty,a='middle';
  if(p==='t'){tx=x+w/2;ty=y-6*s}else if(p==='b'){tx=x+w/2;ty=y+h+16*s}else if(p==='l'){tx=x-6*s;ty=y+h/2+5*s;a='end'}else{tx=x+w+6*s;ty=y+h/2+5*s;a='start'}
  t.setAttribute('x',tx);t.setAttribute('y',ty);t.setAttribute('text-anchor',a)}
function dessiner(st){
  hl.innerHTML='';flux=[];
  const g=el('g',{class:'apparait'},hl);
  (st.zones||[]).forEach(z=>{const gz=el('g',{class:'zone'},g);const[x,y,w,h]=z.r;el('rect',{x,y,width:w,height:h},gz);
    if(z.l){const t=el('text',{'data-r':JSON.stringify(z.r),'data-pos':z.pos},gz);t.textContent=z.l;if(z.k)t.style.fill=z.k==='ok'?'#1f7a44':'#c62f22'}});
  (st.wires||[]).forEach(w=>{const d=w.d||('M'+w.p.map(q=>q.join(' ')).join(' L'));
    el('path',{d,class:'fil fond',stroke:w.c,'data-w':w.w||1},g);
    if(w.f){const f=el('path',{d,class:'fil flux'},g);flux.push(f)}});
  (st.rings||[]).forEach(r=>{el('circle',{cx:r.ring[0],cy:r.ring[1],r:r.ring[2],class:'anneau',fill:'none',stroke:r.c},g)});
  const coul={ok:'#1f9d55',ko:'#d33a2c',info:'#1d2830',p24:'#c77a00',z0:'#6d5bd0',sig:'#b52a95'};
  (st.badges||[]).forEach(b=>{const gb=el('g',{class:'badge'},g);el('circle',{cx:b.x,cy:b.y,fill:coul[b.k]||'#1d2830'},gb);const t=el('text',{fill:coul[b.k]},gb);t.textContent=b.t;t.style.fill=coul[b.k]||'#1d2830'});
  styliser();
}
let anim=null;
function zoomer(cible){
  if(anim)cancelAnimationFrame(anim);
  const dep=vb.slice(),t0=performance.now(),D=reduit?1:750;
  const pas=t=>{let u=Math.min(1,(t-t0)/D);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    vb=dep.map((v,i)=>v+(cible[i]-v)*u);svg.setAttribute('viewBox',vb.join(' '));styliser();
    if(u<1)anim=requestAnimationFrame(pas)};
  anim=requestAnimationFrame(pas);
}
function cadre(v){const m=Math.max(v[2],v[3])*.04;return[v[0]-m,v[1]-m,v[2]+2*m,v[3]+2*m]}
function aller(i){
  i=Math.max(0,Math.min(STEPS.length-1,i));cur=i;const st=STEPS[i];vus.add(i);
  if(st.page!==pageCur){img.style.opacity=0;setTimeout(()=>{img.setAttribute('href',PAGES[st.page-1]);img.style.opacity=1},reduit?0:180);
    if(pageCur){vb=[0,0,1260,1888];svg.setAttribute('viewBox',vb.join(' '))}pageCur=st.page}
  document.getElementById('compteur').textContent='Étape '+(i+1)+' sur '+STEPS.length;
  document.getElementById('titre').textContent=st.title;
  document.getElementById('texte').innerHTML=st.text;
  const wz=document.getElementById('widget');wz.innerHTML=st.img?'<img src="'+st.img+'" alt="Relevés de l\'analyseur de réseau" style="width:100%;border:1px solid #9aa4a0;border-radius:4px;margin:.3rem 0">':'';
  pleine=false;document.getElementById('vue').textContent='Voir la page entière';
  dessiner(st);zoomer(cadre(st.view));
  const part=i>=4?1:0;document.querySelectorAll('.folio').forEach(b=>b.setAttribute('aria-current',+b.dataset.p===part));
  [...piste.children].forEach((b,j)=>{b.setAttribute('aria-current',j===i);b.classList.toggle('vu',vus.has(j))});
  document.getElementById('prec').disabled=i===0;document.getElementById('suiv').disabled=i===STEPS.length-1;
  try{localStorage.setItem('harmo-etape',i)}catch(e){}
}
document.getElementById('prec').onclick=()=>aller(cur-1);
document.getElementById('suiv').onclick=()=>aller(cur+1);
document.getElementById('vue').onclick=e=>{pleine=!pleine;zoomer(pleine?[0,0,1260,1888]:cadre(STEPS[cur].view));e.target.textContent=pleine?"Revenir au détail de l'étape":'Voir la page entière'};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown')aller(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')aller(cur-1)});
window.addEventListener('resize',styliser);
// flux animé
let off=0,tp=performance.now();
function boucle(t){const dt=t-tp;tp=t;if(!reduit){off-=dt*0.045*k();flux.forEach(f=>f.setAttribute('stroke-dashoffset',off))}requestAnimationFrame(boucle)}
requestAnimationFrame(boucle);
let d=0;try{d=+localStorage.getItem('harmo-etape')||0}catch(e){}
aller(d<STEPS.length?d:0);
</script>
